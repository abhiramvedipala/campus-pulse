[project]
name = "campuspulse"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
extend-exclude = ["dbt/target", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B023", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
